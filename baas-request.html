<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Access — BAAS Engineering</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--red:#C8102E;--red-dark:#A00D24;--ink:#1c1c1c;--muted:#565656;--border:#d9d9d9;--line:#ececec;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Jost',system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  .page{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:760px;margin:0 auto;padding:60px 26px 40px}
  .logo{height:64px;width:auto;display:block}
  .tagline{font-size:11px;letter-spacing:6px;text-transform:uppercase;color:#8f8f8f;margin-top:12px}
  h1{font-family:'Archivo',sans-serif;font-weight:700;font-size:clamp(26px,4vw,31px);color:#1c1c1c;margin-top:48px}
  .subtitle{font-weight:400;font-size:15.5px;color:var(--muted);margin-top:12px}
  form{width:100%;max-width:590px;margin:38px auto 0;text-align:left}
  .field{width:100%;border:1px solid var(--border);border-radius:6px;padding:15px 17px;font-family:'Jost',sans-serif;font-size:15px;color:#242424;background:#fff;margin-bottom:16px;display:block}
  .field::placeholder{color:#9a9a9a}
  .field:focus{outline:none;border-color:var(--red)}
  textarea.field{min-height:112px;resize:vertical;line-height:1.6}
  select.field{appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');background-repeat:no-repeat;background-position:right 16px center;color:#242424}
  select.field.placeholder{color:#9a9a9a}
  .err{display:none;color:var(--red);font-size:13px;text-align:center;margin:2px 0 10px}
  .btnwrap{text-align:center;margin-top:10px}
  .btn{background:var(--red);color:#fff;font-family:'Archivo',sans-serif;font-weight:700;font-size:15px;letter-spacing:.5px;padding:15px 40px;border:0;border-radius:6px;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--red-dark)}
  .done{display:none;width:100%;max-width:590px;margin:0 auto}
  .done .sep{height:1px;background:var(--line);margin:0 0 26px}
  .done p{font-weight:400;font-size:16px;line-height:1.9;color:#3d3d3d;text-align:center}
  .redline{width:100%;height:1px;background:linear-gradient(90deg,transparent,#d98d95,transparent)}
  footer{padding:22px 0}
  footer p{text-align:center;font-weight:300;font-size:13px;color:#9a9a9a;letter-spacing:.3px}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}
  @media(max-width:600px){.page{padding:44px 20px 30px}.logo{height:52px}h1{margin-top:34px}}
</style>
</head>

    <div class="tagline">The Program</div>
    <h1>Request Access to the Program</h1>
    <p class="subtitle">Restricted access. Authorization required.</p>

    <form id="req" novalidate>
      <input class="field" id="f-name" type="text" placeholder="Name" autocomplete="name">
      <input class="field" id="f-org" type="text" placeholder="Organization" autocomplete="organization">
      <select class="field placeholder" id="f-domain">
        <option value="" selected disabled hidden>Operational Domain</option>
        <option>Offshore oil &amp; gas</option>
        <option>Maritime</option>
        <option>Defence</option>
        <option>Government / Agency</option>
        <option>Research</option>
        <option>Other</option>
      </select>
      <textarea class="field" id="f-reason" placeholder="Reason for Request"></textarea>
      <input class="field" id="f-email" type="email" placeholder="Email" autocomplete="email">
      <div class="err" id="err"></div>
      <div class="btnwrap"><button class="btn" type="submit">Submit Request</button></div>
    </form>

    <div class="done" id="done">
      <div class="sep"></div>
      <p>Your request has been received. A BAAS program officer will contact you if access is granted.</p>
    </div>
  </main>

  <div class="redline"></div>
  <footer><p>© BAAS Engineering — Restricted Program</p></footer>

<script>
(function(){
  var form=document.getElementById('req'), err=document.getElementById('err'), done=document.getElementById('done');
  var domain=document.getElementById('f-domain');
  domain.addEventListener('change',function(){domain.classList.remove('placeholder');});
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var name=document.getElementById('f-name').value.trim();
    var email=document.getElementById('f-email').value.trim();
    var org=document.getElementById('f-org').value.trim();
    var reason=document.getElementById('f-reason').value.trim();
    var dom=domain.value;
    var ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if(!name){err.textContent='Please enter your name.';err.style.display='block';return;}
    if(!ok){err.textContent='Please enter a valid email address.';err.style.display='block';return;}
    err.style.display='none';
    var body='Name: '+name+'\nOrganization: '+org+'\nOperational Domain: '+dom+'\nReason: '+reason+'\nEmail: '+email;
    form.style.display='none';
    done.style.display='block';
    try{window.location.href='mailto:info@baasdev.com?subject='+encodeURIComponent('Access request — The Program')+'&body='+encodeURIComponent(body);}catch(x){}
  });
})();
</script>
